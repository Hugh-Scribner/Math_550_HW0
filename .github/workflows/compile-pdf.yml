name: Compile LaTeX to PDF and Push

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses the old naming convention

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # Replace with your main .tex file name if it isn't main.tex

      - name: Check if PDF exists
        run: file main.pdf | grep -q 'PDF' # Replace main.pdf with your actual output PDF name

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add main.pdf # Replace with your actual output PDF name
          git commit -m "Automated PDF compilation [skip ci]" || echo "No changes to commit"
          git push